<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Shadow filters for realism -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0e2a32" flood-opacity="0.05" />
    </filter>
    <filter id="topbar-shadow" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="#f0f7fa" />

  <!-- ================= TOP HEADER BAR ================= -->
  <g id="topbar">
    <rect width="1600" height="72" fill="#0c262e" />

    <!-- Brand Logo & Name -->
    <g transform="translate(48, 16)">
      <!-- Robot Icon Box -->
      <rect width="40" height="40" rx="8" fill="#ffffff" />
      <rect x="8" y="12" width="24" height="20" rx="4" fill="none" stroke="#0c262e" stroke-width="2.5" />
      <circle cx="15" cy="20" r="2" fill="#0c262e" />
      <circle cx="25" cy="20" r="2" fill="#0c262e" />
      <path d="M16 26 Q20 29 24 26" fill="none" stroke="#0c262e" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="7" x2="20" y2="12" stroke="#0c262e" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="20" cy="6" r="2" fill="#0c262e" />
      <line x1="5" y1="22" x2="8" y2="22" stroke="#0c262e" stroke-width="2" stroke-linecap="round" />
      <line x1="32" y1="22" x2="35" y2="22" stroke="#0c262e" stroke-width="2" stroke-linecap="round" />

      <!-- Brand Typography -->
      <text x="52" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.3">TechnoResolve</text>
      <text x="52" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2">Desk</text>
    </g>

    <!-- Center Navigation Tabs -->
    <g transform="translate(440, 16)">
      <!-- Home Tab (Active) -->
      <rect x="0" y="2" width="94" height="36" rx="18" fill="#ffffff" />
      <!-- Home Icon -->
      <path d="M18 24 L18 19 L26 13 L34 19 L34 24 Z" fill="none" stroke="#0c262e" stroke-width="2" stroke-linejoin="round" />
      <path d="M23 24 L23 19 L29 19 L29 24" fill="none" stroke="#0c262e" stroke-width="2" />
      <text x="40" y="25" fill="#0c262e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Home</text>

      <!-- My Tickets (2) Tab -->
      <g transform="translate(110, 0)">
        <rect x="0" y="11" width="16" height="18" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.8" />
        <circle cx="0" cy="20" r="3" fill="#0c262e" />
        <circle cx="16" cy="20" r="3" fill="#0c262e" />
        <text x="24" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">My Tickets</text>
        <text x="96" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">(2)</text>
      </g>

      <!-- Account Tab -->
      <g transform="translate(245, 0)">
        <circle cx="8" cy="16" r="4.5" fill="none" stroke="#cbd5e1" stroke-width="1.8" />
        <path d="M2 28 C2 23 6 21 14 21 C22 21 26 23 26 28" fill="none" stroke="#cbd5e1" stroke-width="1.8" />
        <text x="32" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Account</text>
      </g>

      <!-- Help Centre Tab -->
      <g transform="translate(355, 0)">
        <circle cx="8" cy="20" r="8" fill="none" stroke="#cbd5e1" stroke-width="1.8" />
        <text x="5.5" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">?</text>
        <text x="24" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Help Centre</text>
      </g>
    </g>

    <!-- Right Controls: Notification, Roles, Sign Out -->
    <g transform="translate(915, 17)">
      <!-- Bell with Green 23 Badge -->
      <path d="M12 12 C12 7 16 5 20 5 C24 5 28 7 28 12 L28 20 L32 23 L8 23 L12 20 Z" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <circle cx="29" cy="8" r="9" fill="#10b981" />
      <text x="23" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">23</text>

      <!-- Role Switcher Segmented Control -->
      <g transform="translate(50, 0)">
        <rect width="305" height="38" rx="19" fill="#1b3f49" />
        
        <!-- Admin button -->
        <text x="36" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Admin</text>
        
        <!-- Technician button -->
        <rect x="88" y="3" width="105" height="32" rx="16" fill="#ffffff" />
        <!-- Wrench icon -->
        <path d="M102 16 L108 22 M108 16 L102 22" stroke="#0c262e" stroke-width="2" />
        <circle cx="103" cy="21" r="2.5" fill="none" stroke="#0c262e" stroke-width="1.8" />
        <text x="116" y="23" fill="#0c262e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Technician</text>
        
        <!-- Customer button (Active) -->
        <rect x="198" y="3" width="102" height="32" rx="16" fill="#08222b" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="214" cy="16" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M208 24 C208 21 211 19 214 19 C217 19 220 21 220 24" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <text x="227" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Customer</text>
      </g>

      <!-- Sign Out -->
      <g transform="translate(385, 4)">
        <text x="0" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Sign</text>
        <text x="0" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">out</text>
        <path d="M38 10 L44 16 L38 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="28" y1="16" x2="43" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- ================= MAIN CONTAINER ================= -->
  <g transform="translate(425, 120)">

    <!-- Headline Greeting -->
    <text x="0" y="42" fill="#0c262e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">Good morning, maladze.mugeri</text>

    <!-- Global Search Bar -->
    <g transform="translate(0, 68)">
      <rect width="750" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
      <!-- Search Icon -->
      <circle cx="36" cy="26" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
      <line x1="41" y1="31" x2="48" y2="38" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
      <text x="60" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Search knowledge base, error codes, or ask AI...</text>
      <!-- Search Button -->
      <rect x="670" y="10" width="68" height="32" rx="16" fill="#f1f5f9" />
      <text x="684" y="30" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Search</text>
    </g>

    <!-- Category Shortcuts Header -->
    <g transform="translate(0, 160)">
      <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2">CATEGORY SHORTCUTS</text>
      <rect x="160" y="3" width="68" height="20" rx="10" fill="#ccfbf1" />
      <text x="171" y="17" fill="#0f766e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Shortcuts</text>
      <text x="750" y="16" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Select a shortcut to open a pre-categorized ticket</text>
    </g>

    <!-- 4 Shortcut Cards Grid -->
    <g transform="translate(0, 195)">
      <!-- Card 1: Hardware -->
      <g transform="translate(0, 0)">
        <rect width="175" height="135" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <rect x="22" y="22" width="38" height="38" rx="10" fill="#eff6ff" />
        <!-- Laptop Icon -->
        <rect x="31" y="31" width="20" height="14" rx="2" fill="none" stroke="#3b82f6" stroke-width="2" />
        <line x1="28" y1="47" x2="54" y2="47" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
        <text x="22" y="94" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Hardware</text>
        <text x="22" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Devices &amp; Peripherals</text>
      </g>

      <!-- Card 2: Software -->
      <g transform="translate(192, 0)">
        <rect width="175" height="135" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <rect x="22" y="22" width="38" height="38" rx="10" fill="#faf5ff" />
        <!-- Wifi/Cloud Icon -->
        <path d="M33 42 A 10 10 0 0 1 49 42 M30 38 A 15 15 0 0 1 52 38 M27 34 A 20 20 0 0 1 55 34" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="41" cy="45" r="1.5" fill="#a855f7" />
        <text x="22" y="94" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Software</text>
        <text x="22" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Apps &amp; Access</text>
      </g>

      <!-- Card 3: Access -->
      <g transform="translate(384, 0)">
        <rect width="175" height="135" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <rect x="22" y="22" width="38" height="38" rx="10" fill="#fefce8" />
        <!-- Key Icon -->
        <circle cx="37" cy="35" r="5" fill="none" stroke="#eab308" stroke-width="2" />
        <path d="M41 39 L49 47 L46 50 M44 44 L47 47" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="22" y="94" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Access</text>
        <text x="22" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Passwords &amp; VPN</text>
      </g>

      <!-- Card 4: Billing -->
      <g transform="translate(575, 0)">
        <rect width="175" height="135" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <rect x="22" y="22" width="38" height="38" rx="10" fill="#ecfdf5" />
        <!-- Card Icon -->
        <rect x="30" y="32" width="22" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="2" />
        <line x1="30" y1="38" x2="52" y2="38" stroke="#10b981" stroke-width="2" />
        <text x="22" y="94" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Billing</text>
        <text x="22" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Invoices &amp; Cards</text>
      </g>
    </g>

    <!-- Two Feature Banner Cards -->
    <g transform="translate(0, 355)">
      <!-- Left Card: Add New Ticket -->
      <g transform="translate(0, 0)">
        <rect width="360" height="145" rx="18" fill="#143e47" filter="url(#card-shadow)" />
        <!-- Plus Icon -->
        <line x1="180" y1="56" x2="180" y2="76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <line x1="170" y1="66" x2="190" y2="66" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <text x="180" y="104" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Add New Ticket</text>
      </g>

      <!-- Right Card: AI Triage Active -->
      <g transform="translate(385, 0)">
        <rect width="365" height="145" rx="18" fill="#143e47" filter="url(#card-shadow)" />
        <!-- Sparkle Icon -->
        <path d="M26 29 L28 23 L30 29 L36 31 L30 33 L28 39 L26 33 L20 31 Z" fill="none" stroke="#5eead4" stroke-width="1.8" />
        <text x="44" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="800">AI Triage Active</text>
        <text x="26" y="66" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Your requests are instantly analyzed and</text>
        <text x="26" y="86" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">routed by Gemini to the fastest available</text>
        <text x="26" y="106" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">agent.</text>

        <!-- Big Ghost Robot Graphic -->
        <g transform="translate(290, 48)" opacity="0.35">
          <rect width="52" height="42" rx="10" fill="none" stroke="#5eead4" stroke-width="3" />
          <circle cx="16" cy="18" r="3.5" fill="#5eead4" />
          <circle cx="36" cy="18" r="3.5" fill="#5eead4" />
          <line x1="26" y1="0" x2="26" y2="6" stroke="#5eead4" stroke-width="3" stroke-linecap="round" />
          <line x1="6" y1="21" x2="0" y2="21" stroke="#5eead4" stroke-width="3" />
          <line x1="52" y1="21" x2="58" y2="21" stroke="#5eead4" stroke-width="3" />
        </g>
      </g>
    </g>

    <!-- Recent Activity Section -->
    <g transform="translate(0, 525)">
      <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2">RECENT ACTIVITY</text>
      <text x="750" y="20" text-anchor="end" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">View All</text>

      <!-- Ticket 1: Printer is not working -->
      <g transform="translate(0, 38)">
        <rect width="750" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="24" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">Printer is not working</text>
        <text x="24" y="54" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Hardware &amp; Devices · 2026/09/10</text>
        <!-- Status Pill: In Progress -->
        <rect x="635" y="22" width="94" height="28" rx="14" fill="#dbeafe" />
        <text x="682" y="40" text-anchor="middle" fill="#1d4ed8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">In Progress</text>
      </g>

      <!-- Ticket 2: charging port -->
      <g transform="translate(0, 126)">
        <rect width="750" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
        <text x="24" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">charging port</text>
        <text x="24" y="54" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Hardware &amp; Devices · 2026/09/10</text>
        <!-- Status Pill: Open -->
        <rect x="665" y="22" width="64" height="28" rx="14" fill="#dbeafe" />
        <text x="697" y="40" text-anchor="middle" fill="#1d4ed8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Open</text>
      </g>
    </g>

  </g>
</svg>
